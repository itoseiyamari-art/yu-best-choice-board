/* ---------- ページ組み立て ---------- */
document.head.insertAdjacentHTML("beforeend", FONT_LINKS + "<style>" + STYLES + "</style>");

function boot(){
const root = document.createElement("div");
root.id = "root";
root.innerHTML = MARKUP;
document.body.appendChild(root);

/* ---------- データ ---------- */
const SHOPS = JSON.parse(document.getElementById("shops-data").textContent);
const GENRE_EMOJI = {"町中華":"🍚","ラーメン・つけ麺":"🍜","焼肉":"🥩","鮨":"🍣","フレンチトースト":"🍞","カフェ・喫茶":"☕","ピザ":"🍕","イタリアン・パスタ":"🍝","和食・食堂・居酒屋":"🍢","高級中華":"🥡","バーガー・BBQ":"🍔","未分類":"❓"};
/* 表示順の基本リスト。データに新しいジャンルがあれば末尾に自動追加される */
const GENRE_ORDER = Object.keys(GENRE_EMOJI);
const GENRES = [...new Set([...GENRE_ORDER.filter(g => g === "鮨" || SHOPS.some(s => s.genre === g)), ...SHOPS.map(s => s.genre)])];

let areaFilter = "all";
let genreFilter = "all";

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function gmap(s){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.name + " " + s.address);
}

function render(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  let shown = 0;
  SHOPS.forEach(s=>{
    const okArea  = areaFilter === "all" || s.area === areaFilter;
    const okGenre = genreFilter === "all" || s.genre === genreFilter;
    if(!okArea || !okGenre) return;
    shown++;
    const card = document.createElement("div");
    card.className = "card" + (s.mystery ? " mystery" : "");
    card.innerHTML = `
      <div class="card-head">
        <div class="genre-emoji">${esc(s.emoji || GENRE_EMOJI[s.genre] || "🍽️")}</div>
        <h3>${esc(s.name)}<small>${esc(s.reading || "")}</small></h3>
      </div>
      <div class="tags">
        ${s.star ? `<span class="tag star">⭐ 絶対行きたい</span>` : ""}
        <span class="tag genre">${esc(s.genre)}</span>
        <span class="tag area">${esc(s.area)}・${esc(s.spot || "未確定")}</span>
        ${s.note ? `<span class="tag note">${esc(s.note)}</span>` : ""}
        ${s.date ? `<span class="tag note">投稿 ${esc(s.date)}</span>` : ""}
      </div>
      <ul class="info">
        <li><span class="ico">🗾</span><span>${esc(s.address || "詳細はこれから")}</span></li>
        <li><span class="ico">🚉</span><span>${esc(s.station || "—")}</span></li>
        ${s.memo ? `<li><span class="ico">📝</span><span>${esc(s.memo)}</span></li>` : ""}
      </ul>
      <div class="links">
        ${s.fb ? `<a class="btn btn-fb" href="${esc(s.fb)}" target="_blank" rel="noopener">▶ FB投稿</a>` : ""}
        ${s.ig ? `<a class="btn btn-ig" href="${esc(s.ig)}" target="_blank" rel="noopener">▶ IG投稿</a>` : ""}
        ${s.tabelog ? `<a class="btn btn-tabelog" href="${esc(s.tabelog)}" target="_blank" rel="noopener">🍴 食べログ</a>` : ""}
        ${s.reserve ? `<a class="btn btn-reserve" href="${esc(s.reserve)}" target="_blank" rel="noopener">📅 予約する</a>` : ""}
        ${s.official ? `<a class="btn btn-reserve" href="${esc(s.official)}" target="_blank" rel="noopener">🏠 公式サイト</a>` : ""}
        ${s.address && !s.mystery ? `<a class="btn btn-map" href="${gmap(s)}" target="_blank" rel="noopener">🗺️ 地図</a>` : ""}
      </div>`;
    if(s.submitted && canWrite !== false){
      const del = document.createElement("button");
      del.type = "button";
      del.className = "del-btn";
      del.title = "この投稿を削除";
      del.setAttribute("aria-label", s.name + " を削除");
      del.textContent = "✕";
      del.addEventListener("click", ()=> removeShop(s.id));
      card.appendChild(del);
    }
    grid.appendChild(card);
  });
  document.getElementById("shown-count").textContent = shown;
  document.querySelectorAll(".pin-group").forEach(pin=>{
    const n = SHOPS.filter(s=>s.area===pin.dataset.area).length;
    const cnt = pin.querySelector(".pin-count");
    if(cnt) cnt.textContent = n;
    if(pin.classList.contains("pin-optional")) pin.style.display = n ? "" : "none";
  });
}

/* ジャンルのチップと投稿フォームの選択肢はデータから自動生成 */
const genreFilters = document.getElementById("genre-filters");
const genreSelect = document.getElementById("f-genre");
GENRES.forEach(g=>{
  const chip = document.createElement("button");
  chip.type = "button"; chip.className = "chip"; chip.dataset.genre = g;
  chip.textContent = `${GENRE_EMOJI[g] || "🍽️"} ${g}`;
  genreFilters.appendChild(chip);
  const opt = document.createElement("option");
  opt.value = g; opt.textContent = `${GENRE_EMOJI[g] || "🍽️"} ${g}`;
  genreSelect.appendChild(opt);
});
genreSelect.value = "未分類";

function setActive(groupId, attr, value){
  document.querySelectorAll(`#${groupId} .chip`).forEach(c=>{
    c.classList.toggle("active", c.dataset[attr] === value);
  });
}
document.querySelectorAll("#area-filters .chip").forEach(chip=>{
  chip.addEventListener("click", ()=>{ areaFilter = chip.dataset.area; setActive("area-filters","area",areaFilter); render(); });
});
document.querySelectorAll("#genre-filters .chip").forEach(chip=>{
  chip.addEventListener("click", ()=>{ genreFilter = chip.dataset.genre; setActive("genre-filters","genre",genreFilter); render(); });
});
document.querySelectorAll(".pin-group").forEach(pin=>{
  const go = ()=>{
    areaFilter = pin.dataset.area;
    setActive("area-filters","area",areaFilter);
    render();
    document.getElementById("area-filters").scrollIntoView({behavior:"smooth"});
  };
  pin.addEventListener("click", go);
  pin.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
});

/* ---------- 掲示板の保存（artifact capability） ---------- */
let art = null;          // artifact 名前空間（null = この画面では保存不可）
let canWrite = null;     // null=不明 / true / false（not_writer を受けたら false）
const postBtn = document.getElementById("post-btn");
const postStatus = document.getElementById("post-status");

function buildDoc(shops){
  const appSource = document.getElementById("app").textContent;
  const json = JSON.stringify(shops, null, 1).replace(/</g, "\\u003c");
  return '<!doctype html>\n<html lang="ja">\n<head>\n<meta charset="utf-8">\n<title>優ベストチョイス</title>\n</head>\n<body>\n' +
    '<script type="application/json" id="shops-data">\n' + json + '\n<\/script>\n' +
    '<script id="app">' + appSource + '<\/script>\n' +
    '</body>\n</html>\n';
}

function setStatus(msg, cls){
  postStatus.textContent = msg;
  postStatus.className = cls || "";
}

function markReadOnly(){
  canWrite = false;
  postBtn.disabled = true;
  postBtn.textContent = "閲覧専用";
  setStatus("この画面は閲覧専用です。投稿にはこのページの編集権限（共有設定で付与）が必要です。", "err");
  render();
}

async function publishShops(shops, doneMsg){
  if(!art){ setStatus("この画面からは保存できません。claude.ai のアーティファクトページで開いてください。", "err"); return; }
  postBtn.disabled = true;
  setStatus("保存中…（全員の画面に反映されます）");
  try{
    await art.publish(buildDoc(shops));
    setStatus(doneMsg, "ok"); // 直後にページ全体が新バージョンへ再読み込みされる
  }catch(e){
    const code = e && e.code;
    if(code === "conflict"){
      setStatus("他の人が先に更新しました。ページが最新版に更新されます。", "err");
    }else if(code === "not_writer" || code === "not_granted" || code === "consent_required"){
      markReadOnly();
    }else if(code === "rate_limited"){
      postBtn.disabled = false;
      setStatus("投稿が続きすぎました。少し待ってからもう一度どうぞ。", "err");
    }else{
      postBtn.disabled = false;
      setStatus("保存に失敗しました。時間をおいてもう一度お試しください。", "err");
    }
  }
}

document.getElementById("post-form").addEventListener("submit", async e=>{
  e.preventDefault();
  const url = document.getElementById("f-url").value.trim();
  if(!/^https?:\/\//.test(url)){ setStatus("URLは https:// から貼り付けてください。", "err"); return; }
  const name  = document.getElementById("f-name").value.trim();
  const spot  = document.getElementById("f-spot").value.trim();
  const area  = document.getElementById("f-area").value;
  const genre = document.getElementById("f-genre").value;
  const memo  = document.getElementById("f-memo").value.trim();

  const entry = {
    id: "u" + Date.now().toString(36),
    name: name || "（新着・お店確認中）",
    reading: name ? "" : "URLだけ先に投稿",
    emoji: GENRE_EMOJI[genre] || "🍽️",
    genre, area,
    spot: spot || "未確定",
    address: "", station: "",
    memo: memo || "",
    submitted: true,
    date: new Date().toISOString().slice(0,10),
    mystery: !name
  };
  if(document.getElementById("f-star").checked) entry.star = true;
  if(!name) entry.note = "確認中";
  if(/instagram\.com/.test(url)) entry.ig = url;
  else if(/tabelog\.com/.test(url)) entry.tabelog = url;
  else if(/facebook\.com|fb\.watch/.test(url)) entry.fb = url;
  else entry.official = url;

  await publishShops(SHOPS.concat([entry]), "投稿しました！");
});

function removeShop(id){
  const s = SHOPS.find(x=>x.id===id);
  if(!s) return;
  if(!confirm(`「${s.name}」の投稿を削除しますか？（全員の画面から消えます）`)) return;
  publishShops(SHOPS.filter(x=>x.id!==id), "削除しました。");
}

/* capability の解決（後から届く。届かなければ 10 秒で null） */
(window.claude && window.claude.use ? window.claude.use("artifact") : Promise.resolve(null)).then(ns=>{
  art = ns;
  if(art){
    postBtn.disabled = false;
    postBtn.textContent = "掲示板に投稿";
    setStatus("");
  }else{
    postBtn.disabled = true;
    postBtn.textContent = "投稿できません";
    setStatus("この画面では閲覧のみです。claude.ai のアーティファクトページで開くと投稿できます。", "err");
  }
});

render();
} /* boot() ここまで */

if(document.body) boot();
else document.addEventListener("DOMContentLoaded", boot);
</script>

</body>
